[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vision-lifecycle"
version = "0.1.0"
description = "Local registry and evaluation workspace for Vision AI lifecycle tracking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "onnxruntime>=1.18,<2",
  "pycocotools>=2.0.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "onnx>=1.16,<2"]
mmdetection = ["mmdet>=3.3,<3.4", "mmengine>=0.10,<1", "mmcv>=2.1,<2.2"]
mmdeploy = ["mmdeploy-runtime>=1.3,<2"]

[project.scripts]
visionops = "vision_lifecycle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/vision_lifecycle"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
