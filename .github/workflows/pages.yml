name: Publish static lifecycle guide

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Pages snapshot from fixture registry
        env:
          VISION_LIFECYCLE_DB: ${{ runner.temp }}/vision-lifecycle-pages.db
        run: |
          python -m pip install --disable-pip-version-check -e .
          visionops demo > "$RUNNER_TEMP/demo-project.json"
          PROJECT_ID=$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("'"$RUNNER_TEMP"'/demo-project.json").read_text())["id"])')
          visionops export "$PROJECT_ID" --output frontend/public/snapshot.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static UI
        working-directory: frontend
        run: |
          npm install
          VITE_STATIC_MODE=true VITE_BASE_PATH="/${{ github.event.repository.name }}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
